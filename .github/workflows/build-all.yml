name: 多平台与全架构编译任务

on:
  workflow_call:

jobs:
  # =========================================================================
  # 1. Windows x64 桌面控制端构建
  # =========================================================================
  windows-x64:
    name: Windows x64 控制端
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 配置 CMake (x64)
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: 构建二进制文件
        run: cmake --build build --config Release --parallel

      - name: 打包 Windows x64 产物
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build\app-desktop\Release\acast_desktop.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath acast-windows-x64.zip

      - name: 上传 Windows x64 产物
        uses: actions/upload-artifact@v4
        with:
          name: acast-windows-x64.zip
          path: acast-windows-x64.zip
          retention-days: 7

  # =========================================================================
  # 2. Windows ARM64 桌面控制端构建 (MSVC 交叉编译)
  # =========================================================================
  windows-arm64:
    name: Windows ARM64 控制端
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 配置 CMake (ARM64)
        run: cmake -B build-arm64 -A ARM64 -DCMAKE_BUILD_TYPE=Release

      - name: 构建二进制文件 (ARM64)
        run: cmake --build build-arm64 --config Release --parallel

      - name: 打包 Windows ARM64 产物
        shell: pwsh
        run: |
          mkdir dist-arm64
          Copy-Item build-arm64\app-desktop\Release\acast_desktop.exe dist-arm64\
          Copy-Item README.md dist-arm64\
          Compress-Archive -Path dist-arm64\* -DestinationPath acast-windows-arm64.zip

      - name: 上传 Windows ARM64 产物
        uses: actions/upload-artifact@v4
        with:
          name: acast-windows-arm64.zip
          path: acast-windows-arm64.zip
          retention-days: 7

  # =========================================================================
  # 3. macOS Universal 2 桌面控制端构建 (Apple Silicon + Intel 双架构)
  # =========================================================================
  macos-universal:
    name: macOS Universal 控制端
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: "配置 CMake (Universal 2: x86_64 + arm64)"
        run: cmake -B build -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_BUILD_TYPE=Release

      - name: 构建 Universal 二进制
        run: cmake --build build --config Release --parallel

      - name: 验证二进制胖格式切片
        run: |
          file build/app-desktop/ACast.app/Contents/MacOS/ACast || file build/app-desktop/acast_desktop

      - name: 打包 macOS 产物为 DMG (包含拖拽安装快捷方式与统一图标)
        run: |
          mkdir -p dist-macos
          if [ -d "build/app-desktop/ACast.app" ]; then
            cp -R build/app-desktop/ACast.app dist-macos/
          else
            mkdir -p dist-macos/ACast.app/Contents/MacOS
            cp build/app-desktop/acast_desktop dist-macos/ACast.app/Contents/MacOS/ACast
            chmod +x dist-macos/ACast.app/Contents/MacOS/ACast
          fi

          mkdir -p dist-macos/ACast.app/Contents/Resources
          cp app-desktop/resources/acast.icns dist-macos/ACast.app/Contents/Resources/acast.icns

          cat << 'EOF' > dist-macos/ACast.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ACast</string>
              <key>CFBundleIdentifier</key>
              <string>com.catclever.acast</string>
              <key>CFBundleName</key>
              <string>ACast</string>
              <key>CFBundleDisplayName</key>
              <string>ACast</string>
              <key>CFBundleVersion</key>
              <string>0.1.9</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.9</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleIconFile</key>
              <string>acast.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppleEventsUsageDescription</key>
              <string>ACast 需要调用系统终端以展示投屏与反向控制控制台界面</string>
          </dict>
          </plist>
          EOF

          chmod -R 755 dist-macos/ACast.app
          chmod +x dist-macos/ACast.app/Contents/MacOS/*

          ln -s /Applications dist-macos/Applications
          hdiutil create -volname "ACast" -srcfolder dist-macos -ov -format UDZO acast-macos-universal.dmg

      - name: 上传 macOS Universal 产物
        uses: actions/upload-artifact@v4
        with:
          name: acast-macos-universal.dmg
          path: acast-macos-universal.dmg
          retention-days: 7

  # =========================================================================
  # 4. Android 手机端 APK 构建 (minSdk 24, 兼容 Android 7.0+)
  # =========================================================================
  android-app:
    name: Android 手机端 APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装与配置 Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 构建 Android Release APK
        working-directory: app-android
        run: gradle assembleRelease --stacktrace

      - name: 收集与重命名 APK
        run: |
          APK_PATH=$(find app-android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          if [ -z "${APK_PATH}" ]; then
            echo "未找到生成的 APK 文件！" >&2
            exit 1
          fi
          cp "${APK_PATH}" acast-android.apk
          echo "APK 文件大小: $(ls -lh acast-android.apk)"

      - name: 验证 APK 签名有效性与证书指纹
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs acast-android.apk

      - name: 上传 Android APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: acast-android.apk
          path: acast-android.apk
          retention-days: 7

  # =========================================================================
  # 5. iOS 移动端源码与扩展包
  # =========================================================================
  ios-app:
    name: iOS 手机端模块 (iOS 16+)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 打包 iOS 投屏主工程与 ReplayKit 扩展
        run: |
          tar -czvf acast-ios.zip app-ios/ README.md

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: acast-ios.zip
          path: acast-ios.zip
          retention-days: 7
